name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build Source/AutoFacingChairs/AutoFacingChairs.fsproj -c Release
      - name: Verify assemblies
        run: |
          test -f Assemblies/AutoFacingChairs.dll
          test ! -e Assemblies/FSharp.Core.dll
      - name: Package
        run: |
          mkdir -p dist/Auto-Facing-Chairs
          cp -a About Assemblies Languages Patches dist/Auto-Facing-Chairs/
          cd dist
          zip -r Auto-Facing-Chairs-${GITHUB_REF_NAME}.zip Auto-Facing-Chairs
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Auto-Facing-Chairs-${GITHUB_REF_NAME}.zip" --generate-notes
